name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest -v
  installers:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.sh (instalar, actualizar, guardas, desinstalar)
        if: runner.os != 'Windows'
        run: |
          set -eu
          sh -n install.sh
          t="$RUNNER_TEMP/ctd"; rm -rf "$t"; mkdir -p "$t/fakehome" "$t/other"
          git archive --prefix=contenido-a-tu-disco-main/ HEAD | gzip > "$t/src.tgz"
          export HOME="$t/fakehome" CTD_SOURCE="$t/src.tgz" CTD_BIN="$t/bin" CTD_APPS="$t/apps" CTD_SKIP_DEPS=1 CTD_NO_OPEN=1
          export CTD_HOME="$t/home"
          fail() { echo "FALLO: $*"; find "$t" | head -80; exit 1; }
          sh < install.sh || fail "install.sh"
          test -f "$CTD_HOME/app.py" || fail "falta app.py"
          test -d "$CTD_HOME/static" || fail "falta static"
          test -x "$CTD_BIN/contenido-a-tu-disco" || fail "falta el comando"
          if [ "$RUNNER_OS" = macOS ]; then
            test -x "$CTD_APPS/Contenido a tu disco.app/Contents/MacOS/contenido-a-tu-disco" || fail "falta la .app"
          fi
          echo hola > "$CTD_HOME/descargador.log"
          sh < install.sh || fail "actualizacion"
          test "$(cat "$CTD_HOME/descargador.log")" = hola || fail "se perdio descargador.log"
          test -f "$CTD_HOME/app.py" || fail "falta app.py tras actualizar"
          # guardas: carpeta ajena, HOME/ y HOME/. no se tocan ni al instalar ni al desinstalar
          touch "$t/other/keep" "$t/other/app.py" "$HOME/keep"  # app.py ajeno: sin marcador no se toca
          for h in "$t/other" "$HOME/" "$HOME/." "$HOME/noexiste/.."; do
            for a in "" "--uninstall"; do
              if CTD_HOME="$h" sh -s -- $a < install.sh; then fail "debio rechazar CTD_HOME=$h $a"; fi
              test -f "$t/other/keep" && test -f "$HOME/keep" || fail "se borro algo con CTD_HOME=$h $a"
            done
          done
          sh -s -- --uninstall < install.sh || fail "uninstall"
          test ! -e "$CTD_HOME" || fail "no borro la carpeta"
          test ! -e "$CTD_BIN/contenido-a-tu-disco" || fail "no borro el comando"
          test ! -e "$CTD_APPS/Contenido a tu disco.app" || fail "no borro la .app"
          touch "$RUNNER_TEMP/unix-ok"
      - name: Confirmar install.sh
        if: runner.os != 'Windows'
        run: test -f "$RUNNER_TEMP/unix-ok"
      - name: install.ps1 y uninstall.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $env:RUNNER_TEMP 'ctd'
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          git archive --format=zip --prefix=contenido-a-tu-disco-main/ -o "$t\src.zip" HEAD
          if (-not (Test-Path "$t\src.zip")) { throw 'no se armo el zip' }
          $desk = [Environment]::GetFolderPath('Desktop'); $prog = [Environment]::GetFolderPath('Programs')
          $lnk1 = Join-Path $desk 'Contenido a tu disco.lnk'; $lnk2 = Join-Path $prog 'Contenido a tu disco.lnk'
          function Fail($m) {
            Write-Host "FALLO: $m"
            Get-ChildItem -Recurse -Force "$t\home" -ErrorAction SilentlyContinue | Select-Object -First 80 FullName
            Get-ChildItem -Recurse -Force $desk -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            throw $m
          }
          function Run($f) { $global:LASTEXITCODE = 0; Get-Content -Raw $f | Invoke-Expression | Out-Host; return $global:LASTEXITCODE }
          $env:CTD_SOURCE = "$t\src.zip"; $env:CTD_HOME = "$t\home"; $env:CTD_SKIP_DEPS = '1'; $env:CTD_NO_OPEN = '1'
          if ((Run 'install.ps1') -ne 0) { Fail 'install.ps1 fallo' }
          if (-not (Test-Path "$t\home\app.py")) { Fail 'falta app.py' }
          if (-not (Test-Path "$t\home\static")) { Fail 'falta static' }
          if (-not (Test-Path $lnk1)) { Fail 'falta el .lnk del Escritorio' }
          if (-not (Test-Path $lnk2)) { Fail 'falta el .lnk del menu Inicio' }
          Set-Content "$t\home\descargador.log" 'hola'
          if ((Run 'install.ps1') -ne 0) { Fail 'la actualizacion fallo' }
          if ((Get-Content "$t\home\descargador.log") -ne 'hola') { Fail 'se perdio descargador.log' }
          if (-not (Test-Path "$t\home\app.py")) { Fail 'falta app.py tras actualizar' }
          # guardas: carpeta ajena y carpeta personal no se tocan
          New-Item -ItemType Directory -Force -Path "$t\other" | Out-Null
          Set-Content "$t\other\keep" 'x'; Set-Content "$t\other\app.py" 'x'; Set-Content "$env:USERPROFILE\ctd-keep.txt" 'x'
          foreach ($h in @("$t\other", $env:USERPROFILE, "$env:USERPROFILE\", "$env:USERPROFILE\noexiste\..")) {
            $env:CTD_HOME = $h
            if ((Run 'install.ps1') -eq 0) { Fail "install debio rechazar $h" }
            if ((Run 'uninstall.ps1') -eq 0) { Fail "uninstall debio rechazar $h" }
            if (-not ((Test-Path "$t\other\keep") -and (Test-Path "$env:USERPROFILE\ctd-keep.txt"))) { Fail "se borro algo con CTD_HOME=$h" }
          }
          Remove-Item "$env:USERPROFILE\ctd-keep.txt"
          $env:CTD_HOME = "$t\home"
          if ((Run 'uninstall.ps1') -ne 0) { Fail 'uninstall.ps1 fallo' }
          if (Test-Path "$t\home") { Fail 'no borro la carpeta' }
          if ((Test-Path $lnk1) -or (Test-Path $lnk2)) { Fail 'no borro los .lnk' }
          Set-Content "$env:RUNNER_TEMP\win-ok" 'ok'
      - name: Confirmar install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: if (-not (Test-Path "$env:RUNNER_TEMP\win-ok")) { throw 'las pruebas no terminaron' }
